name: Scheduled Dailymotion Cloud Uploader

on:
  schedule:
    - cron: '0 6 * * *'    # 11:30 AM IST (06:00 UTC)
    - cron: '30 11 * * *'  # 05:00 PM IST (11:30 UTC)
    - cron: '0 16 * * *'   # 09:30 PM IST (16:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Headless Cloud Uploader
        env:
          DM_CLIENT_ID: ${{ secrets.DM_CLIENT_ID }}
          DM_CLIENT_SECRET: ${{ secrets.DM_CLIENT_SECRET }}
          DM_PROFILE_ID: ${{ secrets.DM_PROFILE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          python headless_uploader.py

      - name: Commit and Push State Cleanup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded/ || true
          git diff-index --quiet HEAD || (git commit -m "Auto-cleanup uploaded video [skip ci]" && git pull --rebase origin main && git push)
